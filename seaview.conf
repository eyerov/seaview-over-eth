# seaview.conf
#
# Settings for this machine. Edit in place -- this is the live configuration,
# not a template. See SETUP-GUIDE.md Part 7.
#
# Note that seaView connects to the converter itself, using the Serial Over LAN
# port you add inside the application. The address below is used only for a
# reachability check before launch, so a wrong value here cannot break the
# connection -- it just makes the check unhelpful.

# IP address and port of the RS485-to-Ethernet converter.
# Leave CONVERTER_IP empty to skip the check entirely.
CONVERTER_IP="192.168.2.181"
CONVERTER_PORT="23"

# Wine environment. MUST be 64-bit: seaView.exe is a 64-bit binary and a
# 32-bit prefix rejects it with "Bad EXE format". This deliberately does not
# default to ~/.wine, which is 32-bit on a stock Ubuntu install.
WINEPREFIX="$HOME/.wine-seaview"

# Windows-style path to seaView, as Wine sees it.
SEAVIEW_EXE='C:\Program Files\Impact Subsea\seaView\seaView.exe'
