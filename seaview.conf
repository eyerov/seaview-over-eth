# seaview.conf
#
# Settings for this machine. Edit in place -- this is the live configuration,
# not a template.

# --- converter -------------------------------------------------------------
#
# Address of the RS485-to-Ethernet converter. Before launching, the script
# writes these into seaView's own settings so its device search opens
# pre-filled with them, pointed at the network rather than a COM port.
#
# Leave CONVERTER_IP empty to skip both that and the reachability check.
CONVERTER_IP="192.168.2.181"
CONVERTER_PORT="23"

# --- Wine ------------------------------------------------------------------
#
# Wine environment. MUST be 64-bit: seaView.exe is a 64-bit binary and a
# 32-bit prefix rejects it with "Bad EXE format". This deliberately does not
# default to ~/.wine, which is 32-bit on a stock Ubuntu install.
WINEPREFIX="$HOME/.wine-seaview"

# Windows-style path to seaView, as Wine sees it.
SEAVIEW_EXE='C:\Program Files\Impact Subsea\seaView\seaView.exe'
